# City Environmental Sensor Monitoring System
# Milestone 1: walking skeleton. CSV -> ingestion -> MongoDB -> API -> Grafana (temperature only).
name: sensor-monitoring-system

services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?Set MONGO_ROOT_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-sensor_db}
    ports:
      # Bound to localhost only, so the database is not exposed to the network.
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - sensor_net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "if (db.adminCommand('ping').ok !== 1) quit(1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  db-init:
    image: mongo:7.0
    # One-shot and idempotent: safe on a new or an existing database.
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_DB: ${MONGO_DB:-sensor_db}
      MONGO_ROOT_USER: ${MONGO_ROOT_USER}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      APP_DB_USER: ${APP_DB_USER:-sensor_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    volumes:
      - ./mongo/init-db.js:/init/init-db.js:ro
    command:
      - sh
      - -c
      - mongosh --host mongodb -u "$$MONGO_ROOT_USER" -p "$$MONGO_ROOT_PASSWORD" --authenticationDatabase admin --quiet --file /init/init-db.js
    networks:
      - sensor_net

  ingestion:
    build: ./ingestion
    # One-shot batch job: reads the CSV files in ./data, then exits.
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      MONGO_HOST: mongodb
      MONGO_USER: ${APP_DB_USER:-sensor_app}
      MONGO_PASSWORD: ${APP_DB_PASSWORD}
      MONGO_AUTH_SOURCE: ${MONGO_DB:-sensor_db}
      MONGO_DB: ${MONGO_DB:-sensor_db}
      DATA_DIR: /data
      BATCH_SIZE: ${BATCH_SIZE:-500}
      THRESHOLDS_FILE: /config/thresholds.json
    volumes:
      - ./data:/data:ro
      - ./config:/config:ro
    networks:
      - sensor_net

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      MONGO_HOST: mongodb
      MONGO_USER: ${APP_DB_USER:-sensor_app}
      MONGO_PASSWORD: ${APP_DB_PASSWORD}
      MONGO_AUTH_SOURCE: ${MONGO_DB:-sensor_db}
      MONGO_DB: ${MONGO_DB:-sensor_db}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    networks:
      - sensor_net
    healthcheck:
      # urlopen raises on HTTP 503, so a database failure marks the API unhealthy
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  grafana:
    image: grafana/grafana:11.6.11
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource 3.6.0
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - sensor_net

volumes:
  mongo_data:
  grafana_data:

networks:
  sensor_net:
